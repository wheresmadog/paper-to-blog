<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{DOCUMENT_TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<style>
@page { size:841mm 1189mm; margin:0; }
* { box-sizing:border-box; }
html,body { margin:0; }
body { background:#e8edf4; font-family:Arial,Helvetica,sans-serif; color:#152235; }
.poster { width:841mm; height:1189mm; padding:10mm; background:#fff; display:grid; grid-template-rows:110mm 1fr 20mm; gap:8mm; }
header { display:flex; align-items:center; justify-content:center; gap:10mm; text-align:center; }
.identity { flex:1; min-width:0; }
h1 { color:#244da0; font-size:65pt; line-height:1.08; margin:0 0 5mm; }
.authors { font-size:23pt; line-height:1.25; margin:0 0 3mm; }
.affiliations { font-size:21pt; line-height:1.2; margin:0; font-weight:600; }
.header-aside { width:55mm; flex-shrink:0; text-align:center; }
.header-aside img { max-width:100%; height:auto; }
.header-aside p { font-size:17pt; margin:2mm 0; }
/* Card dimensions and spans are adaptable starting values. */
.panels { min-height:0; display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); grid-template-rows:repeat(12,minmax(0,1fr)); gap:7mm; }
.panel { min-height:0; min-width:0; border:0.5mm solid #5375b0; border-radius:4mm; display:flex; flex-direction:column; }
.panel h2 { flex-shrink:0; font-size:32pt; line-height:1.12; text-align:center; margin:0; padding:3mm 5mm; background:#244da0; color:white; border-radius:3.5mm 3.5mm 0 0; }
.panel-body { padding:5mm 7mm; flex:1; min-height:0; display:flex; flex-direction:column; gap:4mm; }
p,li { font-size:24pt; line-height:1.22; margin:0; }
ul { margin:0; padding-left:8mm; }
li + li { margin-top:3mm; }
h3 { font-size:27pt; color:#244da0; margin:0; line-height:1.12; }
figure { margin:0; min-width:0; }
figure img,figure svg { width:100%; height:auto; display:block; }
figcaption { font-size:20pt; line-height:1.18; margin-top:3mm; }
.caption-takeaway { font-weight:700; text-align:center; }
.table { width:100%; border-collapse:collapse; font-size:22pt; }
.table th,.table td { text-align:left; padding:2.5mm 2mm; border-bottom:0.35mm solid #c6d2e5; }
.table th { background:#eff4fb; }
.callout { padding:4mm; background:#eff4fb; border-radius:2mm; font-weight:600; }
.caution { background:#fff3e6; border-left:1.5mm solid #af6c13; padding:3mm; }
.flow { display:flex; align-items:stretch; gap:3mm; }
.flow .step { flex:1; border:0.5mm solid #7394c6; border-radius:2mm; background:#eff4fb; padding:4mm 3mm; text-align:center; font-size:23pt; }
.flow .arrow { align-self:center; font-size:28pt; color:#244da0; }
/* Staggered heights illustrate flexible sizing in each column. */
.p1 { grid-column:1/7; grid-row:1/5; }
.p2 { grid-column:7/13; grid-row:1/6; }
.p3 { grid-column:1/7; grid-row:5/10; }
.p4 { grid-column:7/13; grid-row:6/9; }
.p5 { grid-column:1/7; grid-row:10/13; }
.p6 { grid-column:7/13; grid-row:9/13; }
footer { font-size:17pt; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:2mm; color:#435474; }
footer p { font-size:17pt; }
a { color:#244da0; }
@media screen { .preview-frame { width:max-content; } }
@media print { body { background:white; } .poster { break-inside:avoid; } }
</style>
</head>
<body>
<main class="poster">
<header>{{HEADER}}</header>
<div class="panels">
<section class="panel p1"><h2>{{HEADING_1}}</h2><div class="panel-body">{{CONTENT_1}}</div></section>
<section class="panel p2"><h2>{{HEADING_2}}</h2><div class="panel-body">{{CONTENT_2}}</div></section>
<section class="panel p3"><h2>{{HEADING_3}}</h2><div class="panel-body">{{CONTENT_3}}</div></section>
<section class="panel p4"><h2>{{HEADING_4}}</h2><div class="panel-body">{{CONTENT_4}}</div></section>
<section class="panel p5"><h2>{{HEADING_5}}</h2><div class="panel-body">{{CONTENT_5}}</div></section>
<section class="panel p6"><h2>{{HEADING_6}}</h2><div class="panel-body">{{CONTENT_6}}</div></section>
</div>
<footer>{{FOOTER}}</footer>
</main>
</body>
</html>
