<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{DOCUMENT_TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<style>
@page { size:841mm 1189mm; margin:0; }
* { box-sizing:border-box; }
html,body { margin:0; }
body { background:#e8edf4; font-family:Arial,Helvetica,sans-serif; color:#152235; }
.poster { width:841mm; height:1189mm; padding:14mm 24mm 12mm; border-top:3mm solid #244da0; background:#fff; display:grid; grid-template-rows:110mm 1fr; gap:14mm; }
header { display:flex; align-items:center; justify-content:space-between; gap:20mm; text-align:left; border-bottom:0.4mm solid #aabbd5; padding-bottom:12mm; }
.identity { flex:1; min-width:0; }
h1 { color:#244da0; font-size:65pt; line-height:1.08; margin:0 0 5mm; }
.authors { font-size:23pt; line-height:1.25; margin:0 0 3mm; }
.affiliations { font-size:21pt; line-height:1.2; margin:0; font-weight:600; }
.header-aside { width:180mm; flex-shrink:0; text-align:left; border-left:0.4mm solid #c6d2e5; padding-left:14mm; }
.header-aside img { max-width:100%; height:auto; }
.header-aside p { font-size:17pt; margin:2mm 0; }
.panels { min-height:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-template-rows:minmax(0,1fr); gap:0; }
.column { min-height:0; min-width:0; padding:0 16mm; border-left:0.35mm solid #c6d2e5; display:flex; flex-direction:column; gap:10mm; }
.column:first-child { border-left:0; padding-left:0; }
.column:last-child { padding-right:0; }
.panel { min-height:0; min-width:0; flex:var(--panel-grow,1); display:flex; flex-direction:column; }
.grow-2 { --panel-grow:2; }
/* Optional continuation from the preceding column, before a new section starts. */
.continuation { flex:0 0 32mm; min-height:0; display:flex; flex-direction:column; gap:4mm; }
.panel h2 { min-height:19mm; flex-shrink:0; font-size:38pt; line-height:1.12; text-align:left; margin:0; padding:5mm 0 3mm; border-top:0.8mm solid #244da0; color:#244da0; }
.panel-body { padding:5mm 0; flex:1; min-height:0; display:flex; flex-direction:column; gap:4mm; }
p,li { font-size:24pt; line-height:1.22; margin:0; }
ul { margin:0; padding-left:8mm; }
li + li { margin-top:3mm; }
h3 { font-size:27pt; color:#244da0; margin:0; line-height:1.12; }
figure { margin:0; min-width:0; }
figure img,figure svg { width:100%; height:auto; display:block; }
figcaption { font-size:20pt; line-height:1.18; margin-top:3mm; }
.caption-takeaway { font-weight:700; text-align:center; }
.table { width:100%; border-collapse:collapse; font-size:22pt; }
.table th,.table td { text-align:left; padding:2.5mm 2mm; border-bottom:0.35mm solid #c6d2e5; }
.table th { background:#eff4fb; }
.callout { padding:4mm; background:#eff4fb; border-radius:2mm; font-weight:600; }
.caution { background:#fff3e6; border-left:1.5mm solid #af6c13; padding:3mm; }
.flow { display:flex; align-items:stretch; gap:3mm; }
.flow .step { flex:1; border:0.5mm solid #7394c6; border-radius:2mm; background:#eff4fb; padding:4mm 3mm; text-align:center; font-size:23pt; }
.flow .arrow { align-self:center; font-size:28pt; color:#244da0; }
.p1 { grid-column:1; grid-row:1; }
.p2 { grid-column:2; grid-row:1; }
a { color:#244da0; }
@media screen { .preview-frame { width:max-content; } }
@media print { body { background:white; } .poster { break-inside:avoid; } }
</style>
</head>
<body>
<main class="poster">
<header>{{HEADER}}<aside class="header-aside">{{SOURCE}}</aside></header>
<div class="panels">
<!-- Two columns share the landscape visual style. Each column stacks sections
     independently; adjust .grow-2, merge or split sections for the paper.
     Read the left column top to bottom, then the right column.
     The heading-free continuation above section 4 carries content from section 3.
     Adjust its height to the content, or remove it when unused.
     HEADER contains .identity; SOURCE contains all citations/version/links. -->
<div class="column p1">
<section class="panel"><h2>{{HEADING_1}}</h2><div class="panel-body">{{CONTENT_1}}</div></section>
<section class="panel grow-2"><h2>{{HEADING_2}}</h2><div class="panel-body">{{CONTENT_2}}</div></section>
<section class="panel"><h2>{{HEADING_3}}</h2><div class="panel-body">{{CONTENT_3}}</div></section>
</div>
<div class="column p2">
<div class="continuation"><p>content 3 (continued)</p></div>
<section class="panel grow-2"><h2>{{HEADING_4}}</h2><div class="panel-body">{{CONTENT_4}}</div></section>
<section class="panel"><h2>{{HEADING_5}}</h2><div class="panel-body">{{CONTENT_5}}</div></section>
<section class="panel"><h2>{{HEADING_6}}</h2><div class="panel-body">{{CONTENT_6}}</div></section>
</div>
</div>
</main>
</body>
</html>
